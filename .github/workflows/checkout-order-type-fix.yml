name: Apply checkout type fix
on:
  push:
    branches: [fix/checkout-order-transaction]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix nullable transaction return
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/src/modules/orders/orders.service.ts')
          s = p.read_text()
          old = '''      return manager.findOne(OrderEntity, {
        where: { id: savedOrder.id },
        relations: ["lineItems", "statusHistory"],
      });'''
          new = '''      const createdOrder = await manager.findOne(OrderEntity, {
        where: { id: savedOrder.id },
        relations: ["lineItems", "statusHistory"],
      });
      if (!createdOrder) throw new DomainException(DomainErrorCode.ORDER_NOT_FOUND, "Created order could not be loaded.");
      return createdOrder;'''
          if old not in s:
              raise SystemExit('Expected transaction return pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/orders/orders.service.ts .github/workflows/checkout-order-type-fix.yml
          git commit -m "fix: handle created checkout order lookup"
          git rm .github/workflows/checkout-order-type-fix.yml
          git commit -m "chore: remove temporary checkout type fix workflow"
          git push