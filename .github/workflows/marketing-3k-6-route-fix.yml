name: Marketing HQ 3K-6 route fix gate
on:
  push:
    branches: [fix/3k-6-content-studio-route]
  pull_request:
    paths:
      - "marketing/**"
      - ".github/workflows/marketing-3k-6-route-fix.yml"
jobs:
  marketing-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
