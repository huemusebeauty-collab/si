name: Backend Runtime CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-runtime-ci.yml"
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Verify Node runtime
        run: node --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Runtime regression tests
        run: npx jest src/config/configuration.spec.ts src/config/env.validation.spec.ts --runInBand --coverage=false
