name: Marketing Content navigation gate
on:
  push:
    branches: [fix/content-workspace-navigation]
  pull_request:
    paths:
      - "marketing/**"
      - ".github/workflows/marketing-content-nav-gate.yml"
jobs:
  marketing-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
