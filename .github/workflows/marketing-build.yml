name: Marketing HQ build gate

on:
  push:
    branches: [main]
    paths:
      - "marketing/**"
      - ".github/workflows/marketing-build.yml"
  pull_request:
    paths:
      - "marketing/**"
      - ".github/workflows/marketing-build.yml"

jobs:
  marketing-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build and test gate
        run: npm run build
