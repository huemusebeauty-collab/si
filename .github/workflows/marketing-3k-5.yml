name: Marketing HQ 3K-5 gate

on:
  push:
    branches: [feature/3k-5-publishing-pipeline]
    paths:
      - "marketing/**"
      - ".github/workflows/marketing-3k-5.yml"
  pull_request:
    paths:
      - "marketing/**"
      - ".github/workflows/marketing-3k-5.yml"

jobs:
  marketing-3k-5:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build and test gate
        run: npm run build
