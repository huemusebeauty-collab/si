name: Temporary Dependency Resolution Experiment

on:
  push:
    branches:
      - "experiment/dependency-resolution-20260919"

jobs:
  dependency-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bullmq:
          - "5.12.0"
          - "5.30.0"
          - "5.50.0"
          - "5.70.0"
          - "5.81.5"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify runtime
        run: |
          node --version
          npm --version
      - name: Install candidate dependency graph
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund "bullmq@${{ matrix.bullmq }}"
      - name: Verify resolved dependency versions
        run: npm ls bullmq redis ioredis cache-manager cache-manager-redis-yet --depth=2
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Runtime regression tests
        run: npx jest src/config/configuration.spec.ts src/config/env.validation.spec.ts --runInBand --coverage=false
      - name: Vulnerability snapshot
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require("fs");
          const a = JSON.parse(fs.readFileSync("audit.json", "utf8"));
          const v = a.metadata?.vulnerabilities || {};
          console.log(JSON.stringify(v, null, 2));
          NODE
