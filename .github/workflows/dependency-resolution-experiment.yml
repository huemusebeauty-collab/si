name: Temporary Dependency Resolution Experiment

on:
  push:
    branches:
      - "experiment/dependency-resolution-20260919"

jobs:
  vulnerability-attribution:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install controlled candidate graph
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund "bullmq@5.30.0"
      - name: Create temporary lockfile and audit
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require("fs");
          const a = JSON.parse(fs.readFileSync("audit.json", "utf8"));
          const vulns = a.vulnerabilities || {};
          const rows = Object.values(vulns).map(v => ({
            name: v.name,
            severity: v.severity,
            direct: v.isDirect,
            range: v.range,
            via: (v.via || []).map(x => typeof x === "string" ? x : ({source:x.source,title:x.title,severity:x.severity,range:x.range})),
            effects: v.effects,
            nodes: v.nodes,
            fixAvailable: v.fixAvailable
          }));
          rows.sort((a,b) => ({critical:0,high:1,moderate:2,low:3,info:4}[a.severity] ?? 9) - ({critical:0,high:1,moderate:2,low:3,info:4}[b.severity] ?? 9));
          console.log("VULNERABILITY_DETAIL_START");
          console.log(JSON.stringify(rows, null, 2));
          console.log("VULNERABILITY_DETAIL_END");
          console.log("SUMMARY", JSON.stringify(a.metadata?.vulnerabilities || {}, null, 2));
          NODE
