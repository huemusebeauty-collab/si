name: Product Inventory Hardening CI

on:
  push:
    branches:
      - "fix/product-inventory-billing-hardening"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  product:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify runtime
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm install --include=dev --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Product service tests
        run: npx jest src/modules/products/products.service.spec.ts --runInBand --coverage=false
      - name: Logistics service tests
        run: npx jest src/modules/logistics/logistics.service.spec.ts --runInBand --coverage=false
