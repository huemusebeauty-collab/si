name: Marketing port readiness gate

on:
  push:
    branches: [fix/render-port-readiness]
    paths:
      - "marketing/**"
      - ".github/workflows/marketing-port-readiness.yml"
  pull_request:
    paths:
      - "marketing/**"
      - ".github/workflows/marketing-port-readiness.yml"

jobs:
  marketing-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
