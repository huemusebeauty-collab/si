name: Marketing runtime readiness

on:
  push:
    branches: [test/render-port-runtime]

jobs:
  runtime-readiness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Compile production JavaScript
        run: npm run typecheck && npx tsc -p tsconfig.json
      - name: Start compiled server and probe health
        run: |
          PORT=18080 node dist/main.js > /tmp/marketing-runtime.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health; then
              echo
              echo "compiled runtime health probe: PASS"
              kill $pid 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "compiled runtime health probe: FAIL"
          cat /tmp/marketing-runtime.log
          exit 1
