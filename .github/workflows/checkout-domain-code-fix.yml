name: Fix checkout domain code
on:
  push:
    branches: [fix/checkout-order-transaction]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix invalid domain error code
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/src/modules/orders/orders.service.ts')
          s = p.read_text()
          old = 'DomainErrorCode.ORDER_NOT_FOUND, "Created order could not be loaded."'
          new = 'DomainErrorCode.INVALID_PRODUCT_DATA, "Created order could not be loaded."'
          if old not in s:
              raise SystemExit('Expected error code pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/orders/orders.service.ts
          git commit -m "fix: use existing domain error code for checkout"
          git push
